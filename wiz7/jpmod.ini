; Wizardry 7 Gold 日本語化MOD 設定
; size = 日本語グリフの描画サイズ (640x400 上の実ピクセル。bdf を使うときはフォントの大きさになる)
; adv  = 1文字の送り幅 (320x200 上の論理ピクセル。実ピクセルはこの2倍)
; yoff = 文字セル上端からの縦オフセット (実ピクセル)
; bdf  = BDF ビットマップフォント (jpmod フォルダからの相対パス)。無い文字と bdf を書かない場合は face の GDI フォント
; scale = BDF の拡大倍率 (整数倍)

[font]
face=MS Gothic

; font0 = 6x6 小フォント, font1 = 数字, font2 = 本文 12x14, font3 = 7x4
[font0]
bdf=fonts/shinonome/shnmk12.bdf
size=12
adv=6
yoff=0

; 本文: 東雲 12 ドットを 2 倍 (ゲーム本来のドットの大きさ)。adv=12 で 1 行 15 字
; 16 ドットにするなら bdf=fonts/shinonome/shnmk16.bdf, scale=1, adv=8 (23 字), yoff=4
[font2]
bdf=fonts/shinonome/shnmk12.bdf
scale=2
size=24
adv=12
yoff=2

; Windows 標準の画面 (起動時メニュー・設定ダイアログ) のフォント
[ui]
face=MS UI Gothic
size=12

; 画面の拡大表示。height = 拡大後のゲーム画面の高さ (実ピクセル)。ウィンドウに収まる大きさまで。
; 0 = 拡大しない (元の 640x400)、9999 = ウィンドウいっぱい。smooth=1 でなめらかに拡大 (ぼやける)
[display]
height=1080
smooth=0

[debug]
; 0=ログなし 1=通常 2=メッセージID を全て記録
log=2
